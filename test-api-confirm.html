<!DOCTYPE html>
<html>
<head>
    <title>Test Confirm Payment API</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { padding: 8px; font-size: 14px; }
        input { width: 300px; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
        button:hover { background: #218838; }
        .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #ddd; }
        pre { background: #fff; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔐 Test Confirm Payment API</h1>

    <div class="form-group">
        <label>Tournament ID:</label>
        <input type="number" id="tournamentId" value="8">
    </div>

    <div class="form-group">
        <label>Bearer Token (Owner):</label>
        <input type="text" id="token" placeholder="Paste your owner token here">
    </div>

    <div class="form-group">
        <label>Action:</label>
        <select id="action" style="padding: 8px; width: 316px;">
            <option value="approve">Approve (Xác nhận)</option>
            <option value="reject">Reject (Từ chối)</option>
        </select>
    </div>

    <button onclick="testConfirmPayment()">🚀 Test Confirm Payment</button>

    <div id="result" class="result" style="display:none;"></div>

    <script>
        async function testConfirmPayment() {
            const tournamentId = document.getElementById('tournamentId').value;
            const token = document.getElementById('token').value;
            const action = document.getElementById('action').value;
            const resultDiv = document.getElementById('result');

            if (!token) {
                alert('Vui lòng nhập token!');
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<p>⏳ Đang gọi API...</p>';

            try {
                const response = await fetch(`http://localhost:8000/api/tournaments/${tournamentId}/confirm-payment`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ action: action })
                });

                const data = await response.json();

                let html = `
                    <h3>${response.ok ? '✅' : '❌'} Response Status: ${response.status}</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;

                if (response.ok) {
                    html += `
                        <hr>
                        <h3>🔄 Kiểm tra lại tournament:</h3>
                        <button onclick="checkTournament()">Xem chi tiết giải đấu</button>
                    `;
                }

                resultDiv.innerHTML = html;

            } catch (error) {
                resultDiv.innerHTML = `<h3>❌ Error</h3><pre>${error.message}</pre>`;
            }
        }

        async function checkTournament() {
            const tournamentId = document.getElementById('tournamentId').value;
            const token = document.getElementById('token').value;
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML += '<p>⏳ Đang lấy thông tin giải...</p>';

            try {
                const response = await fetch(`http://localhost:8000/api/tournaments/${tournamentId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/json'
                    }
                });

                const data = await response.json();

                resultDiv.innerHTML += `
                    <h3>📋 Tournament Info:</h3>
                    <p><strong>Payment Status:</strong> <span style="color: ${data.data.payment_status === 'paid' ? 'green' : 'orange'}; font-weight: bold;">${data.data.payment_status}</span></p>
                    <p><strong>Payment Date:</strong> ${data.data.payment_date || 'NULL'}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;

            } catch (error) {
                resultDiv.innerHTML += `<p>❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
